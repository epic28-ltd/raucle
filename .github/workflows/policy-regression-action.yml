name: policy-regression-action

on:
  pull_request:
    paths:
      - ".github/actions/policy-regression/**"
      - "raucle/policy_regression.py"
      - "raucle/policy_regression_suites.json"
      - "tests/test_policy_regression.py"
      - "examples/policy-regression-consumer/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - ".github/actions/policy-regression/**"
      - "raucle/policy_regression.py"
      - "tests/test_policy_regression.py"
      - "examples/policy-regression-consumer/**"
      - "pyproject.toml"

permissions:
  contents: read

jobs:
  consumer-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run consumer fixture through the local action
        uses: ./.github/actions/policy-regression
        with:
          policy-file: examples/policy-regression-consumer/policies.yaml
          scenarios-file: examples/policy-regression-consumer/scenarios.json
          engine-ref: ${{ github.sha }}
          report-file: raucle-policy-regression-report.json
