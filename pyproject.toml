[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raucle"
version = "0.22.0"
description = "Open-source verifiable agent accountability — cryptographic capability receipts and formal proofs for LLM agent activity"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Raucle", email = "oss@raucle.com" },
]
keywords = [
    "ai-agents",
    "ai-audit",
    "agent-accountability",
    "capability-receipts",
    "provenance",
    "ai-governance",
    "eu-ai-act",
    "formal-verification",
    "ai-safety",
    "llm",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Zero mandatory dependencies -- the core scanner runs on the stdlib alone.
dependencies = []

[project.optional-dependencies]
rules = ["pyyaml>=6.0"]
ml = ["transformers>=4.30", "torch>=2.0"]
server = [
    "fastapi>=0.100", "uvicorn[standard]>=0.20", "pydantic>=2.0",
    "slowapi>=0.1.9",     # Rate limiting for gateway endpoints
    "pyotp>=2.9",         # TOTP MFA for admin panel authentication
]
compliance = ["cryptography>=42.0"]
# Post-quantum hybrid signatures (raucle/pq1): ML-DSA-65 needs
# cryptography>=47 built with AWS-LC/BoringSSL; shipped wheels have it since 48.
pq = ["cryptography>=48.0"]
agent-framework = ["agent-framework>=1.0"]
langchain = ["langchain-core>=0.3"]
autogen = ["autogen-agentchat>=0.4"]
crewai = ["crewai>=1.0"]
multimodal = [
    "Pillow>=10.0",       # image loading + EXIF
    "pytesseract>=0.3.10", # OCR (requires tesseract on PATH)
    "pypdf>=4.0",         # PDF stream extraction
]
proof = [
    "z3-solver>=4.12",    # SMT engine for formal-verification provers
]
kms = [
    "boto3>=1.26",        # AWS KMS signer
]
kms-azure = [
    "azure-keyvault-keys>=4.7",  # Azure Key Vault signer
    "azure-identity>=1.12",     # Azure authentication
]
kms-vault = [
    "hvac>=1.0",          # HashiCorp Vault signer
]
kms-all = [
    "boto3>=1.26",
    "azure-keyvault-keys>=4.7",
    "azure-identity>=1.12",
    "hvac>=1.0",
]
dev = [
    "raucle[rules,server,compliance,langchain]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
all = ["raucle[rules,ml,server,compliance,multimodal,proof]"]

[project.scripts]
raucle = "raucle.cli:main"
raucle-detect = "raucle.cli:main"  # deprecated alias, kept for one transition cycle
raucle-aws-mcp = "raucle.broker.cli:main"

[project.urls]
Homepage = "https://raucle.com"
Documentation = "https://github.com/epic28-ltd/raucle/tree/main/docs"
Repository = "https://github.com/epic28-ltd/raucle"
Issues = "https://github.com/epic28-ltd/raucle/issues"

[tool.hatch.build.targets.wheel]
packages = ["raucle", "raucle_detect"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test files use pytest.importorskip before imports — E402 is unavoidable
"tests/*.py" = ["E402"]
# gateway_app.py embeds large HTML/JS admin-panel constants (single-line
# JS, long SVG paths). Line-length limits do not apply to embedded markup.
"raucle/gateway_app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Decorate-only: tests that need the async loop must use @pytest.mark.asyncio
# explicitly. (Switch to ``auto`` later if every async test is the same shape.)
asyncio_mode = "strict"
