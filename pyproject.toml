[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raucle"
version = "0.23.9"
description = "Open-source verifiable agent accountability — cryptographic capability receipts and formal proofs for LLM agent activity"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Raucle", email = "oss@raucle.com" },
]
keywords = [
    "ai-agents",
    "ai-audit",
    "agent-accountability",
    "capability-receipts",
    "provenance",
    "ai-governance",
    "eu-ai-act",
    "formal-verification",
    "ai-safety",
    "llm",
    "prompt-injection",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

# Zero mandatory dependencies -- the core scanner runs on the stdlib alone.
dependencies = []

[project.optional-dependencies]
rules = ["pyyaml>=6.0"]
ml = ["transformers>=4.30", "torch>=2.0"]
server = [
    "fastapi>=0.100", "uvicorn[standard]>=0.20", "pydantic>=2.0",
    "slowapi>=0.1.9",     # Rate limiting for gateway endpoints
    "pyotp>=2.9",         # TOTP MFA for admin panel authentication
]
compliance = ["cryptography>=42.0"]
# Offline consumer policy regression runner: YAML policy parsing and local receipt signing.
regression = ["pyyaml==6.0.2", "cryptography==48.0.0", "cffi==2.1.1", "pycparser==3.12"]
# G1 RFC 3161 timestamping: asn1crypto PARSES the CMS TimeStampToken
# (pure Python, no compiled deps, MIT); signature verification itself
# stays in cryptography, so no new crypto primitive enters the trust
# path. The request encoder is hand-rolled stdlib DER (fixed shape).
timestamp = ["asn1crypto>=1.5.1", "cryptography>=42.0"]
# Post-quantum hybrid signatures (raucle/pq1): ML-DSA-65 needs
# cryptography>=47 built with AWS-LC/BoringSSL; shipped wheels have it since 48.
pq = ["cryptography>=48.0"]
# Finding 85 (phase-14 review): every adapter extra below mints SIGNED
# capability receipts (the capability/audit machinery lazily imports
# cryptography), so the extra ships the signing dependency its README
# narrative promises - never a boot into an ImportError at first receipt.
agent-framework = ["agent-framework>=1.0", "cryptography>=42.0"]
# P2a: the capability guard + guardrail surface were probed under
# 0.19.1 / 0.21.0 / 0.23.1 / 0.25.0 (MIT; FunctionTool ctor and the
# internal ToolContext are stable across that span). The bounds record
# VERIFICATION, not a behavioural limit: lift them deliberately after
# the integration-extras CI job re-verifies on a newer release.
openai-agents = ["openai-agents>=0.19,<0.26", "cryptography>=42.0"]
langchain = ["langchain-core>=0.3", "cryptography>=42.0"]
autogen = ["autogen-agentchat>=0.4", "cryptography>=42.0"]
# D1 (attribution-guard regression hunt): bearer mode is closed in the
# guard, so guard_tool(agent_id=None) denies on every supported release.
# The deny is verified against crewai 1.0.0, 1.5.0, 1.6.1 and 1.15.41 (the
# 1.x BaseTool surface is stable across that span; there was never a
# crewai-side version boundary - the B2 crewai fix was lost in transit and
# no CI job installed the extra, so the red test hid behind skip). The
# upper bound records the last VERIFIED minor: lift it deliberately after
# the integration-extras CI job re-verifies tests/test_attribution_audit.py
# and tests/test_crewai_integration.py on the newer release.
crewai = ["crewai>=1.0,<1.16", "cryptography>=42.0"]
langgraph = ["langgraph>=0.2", "cryptography>=42.0"]
# P2a verified spans (18 Nov 2026, CPython 3.13). Same convention as the
# rows above: the bounds record VERIFICATION, not a behavioural limit.
# pydantic-ai: guard + RunContext attribution surface probed under
# 1.107.10 / 2.59.0 / 2.65.0 / 2.70.0 (MIT; upstream floor py>=3.11).
pydantic-ai = ["pydantic-ai>=1.107,<3", "cryptography>=42.0"]
# google-adk: guard + ToolContext attribution surface probed under
# 1.39.1 / 2.7.0 / 2.11.0 / 2.14.1 (Apache-2.0; py>=3.11). NOTE: neither
# of these extras can be co-installed with the crewai extra at these
# spans - joint resolution downgrades both to pre-1.0 releases (the
# crewai pins win on shared dependencies) - so they ride their own CI
# slot, 'Test (integration extras, P2a)', and deployments install at
# most one family per environment.
google-adk = ["google-adk>=1.39,<3", "cryptography>=42.0"]
multimodal = [
    "Pillow>=10.0",       # image loading + EXIF
    "pytesseract>=0.3.10", # OCR (requires tesseract on PATH)
    "pypdf>=4.0",         # PDF stream extraction
]
proof = [
    "z3-solver>=4.12",    # SMT engine for formal-verification provers
]
kms = [
    "boto3>=1.26",        # AWS KMS signer
]
kms-azure = [
    "azure-keyvault-keys>=4.7",  # Azure Key Vault signer
    "azure-identity>=1.12",     # Azure authentication
]
kms-vault = [
    "hvac>=1.0",          # HashiCorp Vault signer
]
kms-all = [
    "boto3>=1.26",
    "azure-keyvault-keys>=4.7",
    "azure-identity>=1.12",
    "hvac>=1.0",
]
dev = [
    "raucle[rules,server,compliance,timestamp,langchain,proof,openai-agents]",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=2.4",
    # F143 (external re-check): the independent JOSE interop proof
    # (tests/test_pq_interop.py) verifies pq1 receipts with joserfc, the
    # library whose crit handling demonstrably rejects unknown critical
    # headers (RFC 7515 §4.1.11). Verified span: joserfc 1.8.0 (24 Nov 2026,
    # py3.13, cryptography 50.0.2), with the verify-path crit rejection
    # re-verified on 1.7.7 (the resolution 3.10 environments get; it shares
    # the crit behaviour but not the default signature size bound). The
    # bounds record VERIFICATION, not a behavioural limit: lift deliberately
    # after re-running the interop test on the newer minor. PyJWT was probed
    # first and DISQUALIFIED (it silently accepts unknown crit on a valid
    # signature).
    "joserfc>=1.7.7,<2",
]
all = ["raucle[rules,ml,server,compliance,timestamp,multimodal,proof]"]

[project.scripts]
raucle = "raucle.cli:main"
raucle-detect = "raucle.cli:main"  # deprecated alias, kept for one transition cycle
raucle-aws-mcp = "raucle.broker.cli:main"
# Auditor-facing offline provenance verifier (issue #346, ADR 0011): a
# separately distributable front end over the canonical Python verifier.
raucle-verify = "raucle.verifier_cli:main"

[project.urls]
Homepage = "https://raucle.com"
Documentation = "https://github.com/epic28-ltd/raucle/tree/main/docs"
Repository = "https://github.com/epic28-ltd/raucle"
Issues = "https://github.com/epic28-ltd/raucle/issues"

[tool.hatch.build.targets.wheel]
packages = ["raucle", "raucle_detect"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test files use pytest.importorskip before imports — E402 is unavoidable
"tests/*.py" = ["E402"]
# gateway_app.py embeds large HTML/JS admin-panel constants (single-line
# JS, long SVG paths). Line-length limits do not apply to embedded markup.
"raucle/gateway_app.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Decorate-only: tests that need the async loop must use @pytest.mark.asyncio
# explicitly. (Switch to ``auto`` later if every async test is the same shape.)
asyncio_mode = "strict"

[tool.mypy]
# Q9 (external v0.23.7 review): type checking introduced as a baseline gate,
# minimal config. The whole package is NOT yet clean; CI runs the
# currently-clean module allowlist (tools/mypy-clean-modules.txt) so NEW
# errors in those modules fail the build. raucle package only, day one.
python_version = "3.12"
ignore_missing_imports = true
