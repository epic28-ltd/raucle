services:
  raucle-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: raucle-gateway
    environment:
    - RAUCLE_GATEWAY_HOST=0.0.0.0
    - RAUCLE_GATEWAY_PORT=8080
    - RAUCLE_ADMIN_PORT=8081
    - RAUCLE_ADMIN_KEY=${RAUCLE_ADMIN_KEY:?RAUCLE_ADMIN_KEY is required}
    - RAUCLE_SIGNER=${RAUCLE_SIGNER:-local}
    - RAUCLE_KMS_KEY_ID=${RAUCLE_KMS_KEY_ID:-}
    - AWS_REGION=${AWS_REGION:-eu-west-1}
    - RAUCLE_POLICY_FILE=/etc/raucle/policies.yaml
    - RAUCLE_RECEIPT_STORE=/data/receipts.jsonl
    - RAUCLE_AUDIT_CHAIN=/data/audit.jsonl
    - RAUCLE_AUDIT_PERSIST=true
    - RAUCLE_AUDIT_LOG=/data/gateway-audit.jsonl
    - RAUCLE_COMPLIANCE_FRAMEWORK=${RAUCLE_COMPLIANCE_FRAMEWORK:-eu-ai-act}
    - RAUCLE_HEALTH_KEY=${RAUCLE_HEALTH_KEY:-}
    - RAUCLE_SIEM_ENABLED=${RAUCLE_SIEM_ENABLED:-false}
    - RAUCLE_SIEM_BACKEND=${RAUCLE_SIEM_BACKEND:-}
    - RAUCLE_SIEM_URL=${RAUCLE_SIEM_URL:-}
    - RAUCLE_SIEM_TOKEN=${RAUCLE_SIEM_TOKEN:-}
    - RAUCLE_POLICY_DIR=/etc/raucle/policies-demo
    # Authentication. The CODE default stays RAUCLE_GATE_AUTH=off (a
    # deliberate backwards-compatible local-dev posture with a boot banner),
    # but this compose publishes the gate behind Caddy on a public HTTPS
    # listener, so the supplied deployment must require an explicit
    # authentication choice: compose refuses to start until you set
    # RAUCLE_GATE_AUTH here or in your .env. Pick "apikey" (per-agent
    # X-Api-Key credentials) or "token" (capability tokens verified against
    # the trust registry), provision the credentials with
    # `raucle agents issue-key --agent-id agent:<id> --store
    # /data/agent-credentials.jsonl`, and follow Step 1 of
    # docs/getting-started/20-production-hardening.md for the full story.
    - RAUCLE_GATE_AUTH=${RAUCLE_GATE_AUTH:?Set to apikey or token}
    # Rate limiting posture. The image installs the [server] extra, so
    # slowapi is always present and the serving-mode refusal in
    # raucle/gateway_app.py cannot fire here; RAUCLE_DISABLE_RATE_LIMIT is
    # deliberately not set.
    - RAUCLE_GATE_RATE_LIMIT=${RAUCLE_GATE_RATE_LIMIT:-200/minute}
    # The per-route limit on /gate (defaults to the same 200/minute posture;
    # the code default matches).
    - RAUCLE_GATE_ROUTE_LIMIT=${RAUCLE_GATE_ROUTE_LIMIT:-200/minute}
    # The gateway sits behind the Caddy service in this file: without
    # trust-proxy, every request's socket peer is Caddy itself, so ALL
    # external callers collapse into one SHARED rate-limit bucket and one
    # noisy tenant starves everyone else (a shared-bucket DoS on legitimate
    # agents). With it, the left-most X-Forwarded-For entry becomes the
    # rate-limit key. Only enable when the proxy is trusted: a caller that
    # reaches the gateway directly can forge that header.
    - RAUCLE_TRUST_PROXY=${RAUCLE_TRUST_PROXY:-1}
    # Schema binding is opt-in. Point RAUCLE_TOOL_SCHEMA_MANIFEST at YOUR
    # tool manifest (a tool name to JSON-Schema map) and mount the file
    # read-only beside the policy volumes to bind /gate receipts to the
    # declared definition digests; unset preserves the legacy behaviour (no
    # schema binding). The volume is not pre-wired: add it when you enable
    # the entry below.
    # - RAUCLE_TOOL_SCHEMA_MANIFEST=/etc/raucle/tools-manifest.json
    - RATE_LIMIT=${RATE_LIMIT:-6000}
    volumes:
    - ./policies:/etc/raucle/policies:ro
    - ./policies/examples:/etc/raucle/policies-demo:ro
    - raucle-data:/data
    networks:
    - raucle-internal
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8081/health
      interval: 30s
      timeout: 5s
      retries: 3
  # Demo traffic simulator. NOTE: it carries no credentials, so once
  # RAUCLE_GATE_AUTH is set to apikey or token, every demo call earns a
  # receipted DENY (an unauthenticated attempt is itself evidence). For a
  # closed deployment remove this service.
  demo-agents:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: raucle-demo-agents
    restart: unless-stopped
    depends_on:
    - raucle-gateway
    environment:
    - DEMO_GATEWAY_URL=http://raucle-gateway:8080
    - DEMO_INTERVAL=8
    entrypoint:
    - python
    - scripts/demo_agents.py
    - --gateway
    - http://raucle-gateway:8080
    - --interval
    - '0.3'
    - --concurrency
    - '5'
    - --sleep-floor
    - '0.05'
    - --quiet
    networks:
    - raucle-internal
  caddy:
    image: caddy:2-alpine
    container_name: raucle-caddy
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    environment:
    - DOMAIN=${RAUCLE_DOMAIN:-localhost}
    networks:
    - raucle-internal
    depends_on:
    - raucle-gateway
    restart: unless-stopped
networks:
  raucle-internal:
    driver: bridge
    internal: false
volumes:
  raucle-data: null
  caddy-data: null
  caddy-config: null
