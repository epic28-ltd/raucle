services:
  raucle-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: raucle-gateway
    environment:
    - RAUCLE_GATEWAY_HOST=0.0.0.0
    - RAUCLE_GATEWAY_PORT=8080
    - RAUCLE_ADMIN_PORT=8081
    - RAUCLE_ADMIN_KEY=${RAUCLE_ADMIN_KEY:?RAUCLE_ADMIN_KEY is required}
    - RAUCLE_SIGNER=${RAUCLE_SIGNER:-local}
    - RAUCLE_KMS_KEY_ID=${RAUCLE_KMS_KEY_ID:-}
    - AWS_REGION=${AWS_REGION:-eu-west-1}
    - RAUCLE_POLICY_FILE=/etc/raucle/policies.yaml
    - RAUCLE_RECEIPT_STORE=/data/receipts.jsonl
    - RAUCLE_AUDIT_CHAIN=/data/audit.jsonl
    - RAUCLE_AUDIT_PERSIST=true
    - RAUCLE_AUDIT_LOG=/data/gateway-audit.jsonl
    - RAUCLE_COMPLIANCE_FRAMEWORK=${RAUCLE_COMPLIANCE_FRAMEWORK:-eu-ai-act}
    - RAUCLE_HEALTH_KEY=${RAUCLE_HEALTH_KEY:-}
    - RAUCLE_SIEM_ENABLED=${RAUCLE_SIEM_ENABLED:-false}
    - RAUCLE_SIEM_BACKEND=${RAUCLE_SIEM_BACKEND:-}
    - RAUCLE_SIEM_URL=${RAUCLE_SIEM_URL:-}
    - RAUCLE_SIEM_TOKEN=${RAUCLE_SIEM_TOKEN:-}
    - RAUCLE_POLICY_DIR=/etc/raucle/policies-demo
    - RATE_LIMIT=${RATE_LIMIT:-6000}
    - RAUCLE_GATE_RATE_LIMIT=${RAUCLE_GATE_RATE_LIMIT:-60000/minute}
    volumes:
    - ./policies:/etc/raucle/policies:ro
    - ./policies/examples:/etc/raucle/policies-demo:ro
    - raucle-data:/data
    networks:
    - raucle-internal
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:8080/livez
      interval: 30s
      timeout: 5s
      retries: 3
  demo-agents:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: raucle-demo-agents
    restart: unless-stopped
    depends_on:
    - raucle-gateway
    environment:
    - DEMO_GATEWAY_URL=http://raucle-gateway:8080
    - DEMO_INTERVAL=8
    entrypoint:
    - python
    - scripts/demo_agents.py
    - --gateway
    - http://raucle-gateway:8080
    - --interval
    - '0.3'
    - --concurrency
    - '5'
    - --sleep-floor
    - '0.05'
    - --quiet
    networks:
    - raucle-internal
  caddy:
    # Digest-pinned (Q9 review item 2): caddy:2-alpine floated to
    # v2.11.9-alpine at pin time (24 Nov 2026; linux/amd64 manifest digest,
    # docker buildx imagetools inspect). The stock image ships NO rate-limit
    # module (verified: caddy list-modules) - see the Caddyfile.
    image: caddy:2-alpine@sha256:fc9cbc100585871d18d4e451cca7021785c90a7006087427ae5ceb3e4efe6424
    container_name: raucle-caddy
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - caddy-data:/data
    - caddy-config:/config
    environment:
    - DOMAIN=${RAUCLE_DOMAIN:-localhost}
    networks:
    - raucle-internal
    depends_on:
    - raucle-gateway
    restart: unless-stopped
networks:
  raucle-internal:
    driver: bridge
    internal: false
volumes:
  raucle-data: null
  caddy-data: null
  caddy-config: null
