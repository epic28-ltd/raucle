# Raucle gateway chart values
# Every value maps to the documented gateway configuration; see
# docs/getting-started/20-production-hardening.md for the reasoning.

replicaCount: 1  # ONE writer per chain (tamper-evidence); see deployment-topologies.md

image:
  repository: ghcr.io/epic28-ltd/raucle-gateway  # build from Dockerfile.gateway
  tag: ""            # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  gatewayPort: 8080   # /gate, /health
  adminPort: 8081    # admin panel + API

ingress:
  enabled: false
  className: nginx
  gateway:
    host: gate.example.com
    # /gate* only; never expose the admin port here
  admin:
    host: admin.example.com  # put behind your SSO/mTLS

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""   # cluster default

# Gateway configuration (env-var names mirror the application)
config:
  adminKey: ""            # REQUIRED - set via --set or a Secret
  demoKey: ""             # public read-only evaluator key (optional)
  demoMode: false         # REQUIRED true with demoKey: /api/demo-key 404s otherwise
  gateRouteRateLimit: "200/minute"  # per-route limit on /gate (RED-037)
  gateRateLimit: "1000/minute"      # default limit for the other routes
  trustProxy: ""          # "1" only when behind a proxy that sets X-Forwarded-For
  gateAuth: "apikey"       # off | apikey | token (off = trusted internal only)
  signer: "local"         # local | aws | azure
  kmsKeyId: ""
  emitReceipts: true
  receiptStoreDir: /data/receipts-segments
  receiptSegmentMaxBytes: "67108864"
  receiptIndexPath: /data/receipts-segments/index.sqlite
  # EPIC Q lane Q-2: session behavioural window bounds (defaults equal the
  # code defaults). TTL bounds each session key's history in time, max keys
  # bounds live (session, agent) windows, max entries bounds one key
  # against a hot session.
  sessionWindowTtlSeconds: "900"
  sessionWindowMaxKeys: "1024"
  sessionWindowMaxEntries: "10000"
  # Boot streaming (L1) + the J1 ceiling: bootMemCeilingMb is 0 (derive
  # from detected memory minus headroom); bootScanWindowMb is W_replay,
  # the bounded read window the boot's tail resume, chain scan and
  # rebuild feeding share; indexCacheMb is the SQLite page cache cap for
  # the receipt index (mmap stays off so resident size never tracks the
  # file). Defaults equal the code defaults, honestly pending the X5
  # bench's re-derivation (docs/nfr/boot-streaming-v1.md).
  bootMemCeilingMb: "0"
  bootScanWindowMb: "64"
  indexCacheMb: "64"
  signerKeyPath: /data/gateway-signing-key.pem
  healthKey: ""
  policyFile: /etc/raucle/policies.yaml
  policyDir: /etc/raucle/policies-demo
  complianceFramework: "eu-ai-act"
  traceHeader: "X-Trace-Id"

siem:
  enabled: false
  backend: ""
  url: ""
  token: ""

# Policies: map of filename -> YAML content
policies: {}
#  banking.yaml: |
#    version: 1
#    ...

tolerations: []
nodeSelector: {}
affinity: {}